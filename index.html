<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog – TD SYNNEX Software Solutions</title>
<meta name="description" content="Novinky, promoakce a tipy z oblasti Microsoft, Adobe, AWS a Google od TD SYNNEX Czech.">
<style>
:root{
  --tds-deep-teal:#003031;--tds-teal:#005758;--tds-green:#2D9F88;--tds-aqua:#08BED5;
  --tds-white:#FFFFFF;--tds-light-grey:#F0F0F0;--tds-cool-grey:#D9D8D7;
  --ink:#003031;--muted:#4A5556;--tds-font:"TWK Everett",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--tds-font);background:var(--tds-light-grey);color:var(--ink);line-height:1.55;text-align:left;-webkit-font-smoothing:antialiased}

/* ── Hero ── */
.hero{background:linear-gradient(135deg,var(--tds-deep-teal) 0%,var(--tds-teal) 100%);color:#fff;padding:36px 24px 88px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-160px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,var(--tds-green) 0%,transparent 70%);opacity:.28;pointer-events:none}
.hero-inner{max-width:1032px;margin:0 auto;position:relative;z-index:1}
.brand{display:inline-block;margin-bottom:36px}
.brand img{display:block;width:200px;min-width:100px;height:auto}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--tds-aqua);margin-bottom:8px}
.hero h1{font-weight:700;font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin-bottom:10px}
.hero p{font-size:1.05rem;color:#D7E6E4;max-width:58ch}

/* ── Wrap ── */
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* ── Filters ── */
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:-24px;position:relative;z-index:2;padding-bottom:32px}
.pill{border:1px solid var(--tds-cool-grey);border-radius:999px;padding:9px 18px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:var(--tds-font);transition:background .15s,color .15s,box-shadow .15s;background:var(--tds-white);color:var(--tds-teal);box-shadow:0 2px 8px rgba(0,48,49,.1)}
.pill:hover{border-color:var(--tds-green)}
.pill.active{background:var(--tds-teal);border-color:var(--tds-teal);color:#fff;box-shadow:0 3px 10px rgba(0,48,49,.2)}

/* ── Grid ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;padding-bottom:60px}
.card{background:var(--tds-white);border:1px solid var(--tds-cool-grey);border-radius:12px;text-decoration:none;color:inherit;display:flex;flex-direction:column;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,48,49,.14);border-color:var(--tds-green)}
.card-cover{width:100%;aspect-ratio:16/9;overflow:hidden;flex-shrink:0}
.card-cover img{width:100%;height:100%;object-fit:cover;display:block}
.card-cover-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;padding:24px;background:linear-gradient(135deg,var(--tds-deep-teal),var(--tds-teal));color:#fff}
.card-cover-placeholder svg{width:48px;height:48px;opacity:.5}
.card-body{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
.card-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.badge{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid var(--tds-teal);color:var(--tds-teal);background:var(--tds-white)}
.card-date{font-size:.82rem;color:var(--muted)}
.card-title{font-size:1.1rem;font-weight:700;color:var(--tds-teal);line-height:1.28;margin-bottom:8px}
.card-perex{color:var(--muted);font-size:.9rem;line-height:1.5;flex:1}
.card-read{display:inline-block;margin-top:14px;font-size:.88rem;font-weight:700;color:var(--tds-teal)}

/* ── Docs link ── */
.docs-link{display:inline-flex;align-items:center;gap:8px;background:var(--tds-white);border:1px solid var(--tds-cool-grey);border-radius:10px;padding:14px 20px;text-decoration:none;color:var(--tds-teal);font-weight:700;font-size:.95rem;margin-bottom:32px;transition:border-color .15s,box-shadow .15s}
.docs-link:hover{border-color:var(--tds-green);box-shadow:0 4px 14px rgba(0,48,49,.1)}
.docs-link svg{width:20px;height:20px;color:var(--tds-teal);flex-shrink:0}

/* ── States ── */
.loading,.empty{text-align:left;padding:60px 0;color:var(--muted);font-size:1rem}
.loading::before{content:"";display:block;width:32px;height:32px;border:3px solid var(--tds-cool-grey);border-top-color:var(--tds-teal);border-radius:50%;animation:spin .8s linear infinite;margin:0 0 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}

footer{max-width:1080px;margin:0 auto;text-align:left;padding:8px 24px 48px;color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
footer a{color:var(--tds-teal);font-weight:700;text-decoration:none}
footer a:hover{color:var(--tds-deep-teal)}
footer img{display:block;width:300px;height:auto}

@media(max-width:560px){.hero{padding:28px 16px 80px}.wrap{padding:0 16px}.grid{grid-template-columns:1fr}.brand img{width:160px}footer img{width:240px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <a href="https://tdsynnexcz.github.io/" class="brand" aria-label="TD SYNNEX - přehled nástrojů"><img src="assets/brand/logo-aqua-white.png" alt="TD SYNNEX" width="200"></a>
    <div class="eyebrow">Software Solutions</div>
    <h1>Blog</h1>
    <p>Novinky, promoakce a tipy z oblasti Microsoft, Adobe, AWS a Google.</p>
  </div>
</header>

<main class="wrap">
  <div class="filter-bar" id="filters">
    <button class="pill active" data-v="">Vše</button>
    <button class="pill" data-v="Microsoft">Microsoft</button>
    <button class="pill" data-v="Adobe">Adobe</button>
    <button class="pill" data-v="AWS">AWS</button>
    <button class="pill" data-v="Google">Google</button>
  </div>

  <a class="docs-link" href="dokumenty/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    Knihovna dokumentů a návodů
  </a>

  <div id="loading" class="loading"></div>
  <div id="grid" class="grid hidden"></div>
  <div id="empty" class="empty hidden"></div>
</main>

<footer>
  <span>TD SYNNEX Czech Republic &nbsp;·&nbsp; <a href="https://tdsynnexcz.github.io/">Přehled nástrojů</a></span>
  <img src="assets/brand/software-solutions-rgb.png" alt="TD SYNNEX | Software Solutions" width="300">
</footer>

<script>
const VC = {Microsoft:'ms', Adobe:'adobe', AWS:'aws', Google:'google'};
let all = [], filter = '';

const MONTHS = ['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];
function fmtDate(d){const[y,m,day]=d.split('-');return`${parseInt(day)}. ${MONTHS[parseInt(m)-1]} ${y}`;}
function vc(v){return VC[v]||''}

function card(a){
  const cls = vc(a.vendor);
  const cover = a.image
    ? `<img src="${a.image}" alt="" loading="lazy">`
    : `<div class="card-cover-placeholder ${cls}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`;
  return `<a class="card" href="posts/${a.slug}.html">
    <div class="card-cover">${cover}</div>
    <div class="card-body">
      <div class="card-meta"><span class="badge ${cls}">${a.vendor}</span><span class="card-date">${fmtDate(a.date)}</span></div>
      <h2 class="card-title">${a.title}</h2>
      <p class="card-perex">${a.perex}</p>
      <span class="card-read">Číst →</span>
    </div>
  </a>`;
}

function render(){
  const g = document.getElementById('grid');
  const e = document.getElementById('empty');
  const shown = filter ? all.filter(a=>a.vendor===filter) : all;
  if(!shown.length){
    g.classList.add('hidden'); e.classList.remove('hidden');
    e.textContent = all.length ? 'Žádné články pro vybraný vendor.' : 'Zatím zde nejsou žádné články.';
  } else {
    g.innerHTML = shown.map(card).join(''); g.classList.remove('hidden'); e.classList.add('hidden');
  }
}

document.querySelectorAll('.pill').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); filter=b.dataset.v; render();
  });
});

fetch('articles.json').then(r=>r.ok?r.json():[]).catch(()=>[]).then(data=>{
  document.getElementById('loading').classList.add('hidden');
  all = data; render();
});
</script>
</body>
</html>
